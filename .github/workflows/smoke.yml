name: Smoke suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shiftify_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shiftify_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/shiftify_ci?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-do-not-reuse-anywhere
      JWT_REFRESH_SECRET: ci-only-refresh-secret-do-not-reuse-anywhere
      RETURN_DEV_OTP: "true"
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed plan catalogue + demo accounts
        run: npm run seed

      - name: Build
        run: npm run build

      - name: Start server
        run: nohup node dist/server.js > server.log 2>&1 &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start in time"
          cat server.log
          exit 1

      - name: Run smoke suite
        run: npm run smoke

      - name: Server logs (on failure)
        if: failure()
        run: cat server.log
